#cloud-config
preserve_hostname: False
hostname: fedora-metallb
fqdn: fedora-metallb.onp.example.local
packages:
  - zsh
  - git
  - pip
  - make
  - lua
  - jq
runcmd:
  - [ modprobe, ip_tables ]
  - [ modprobe, ip6_tables ]

  # Docker removal (if any old version exists)
  - [ dnf, remove, -y, docker, docker-client, docker-client-latest, docker-common, docker-latest, docker-latest-logrotate, docker-logrotate, docker-selinux, docker-engine-selinux, docker-engine ]

  # Docker installation
  - [ dnf, -y, install, dnf-plugins-core ]
  - [ dnf-3, config-manager, --add-repo, https://download.docker.com/linux/fedora/docker-ce.repo ]
  - [ dnf, install, -y, docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin ]
  - [ systemctl, enable, --now, docker ]
  - [ usermod, -aG, docker, onp ]

  # Dotfiles and environment setup
  - [ su, onp, -c, "git clone https://github.com/k37y/dotfiles /home/onp/dotfiles" ]
  - [ su, onp, -c, "make -C /home/onp/dotfiles nvim-linux-amd64" ]
  - [ su, onp, -c, "make -C /home/onp/dotfiles ohmyzsh" ]
  - [ su, onp, -c, "make -C /home/onp/dotfiles git" ]
  - [ su, onp, -c, "make -C /home/onp/dotfiles go-linux-amd64-download GO_VERSION=go" ]
  - [ su, onp, -c, "make -C /home/onp/dotfiles kind-linux-amd64-download" ]
  - [ su, onp, -c, "make -C /home/onp/dotfiles fzf-linux-amd64" ]
  - [ su, onp, -c, "git clone https://github.com/k37y/metallb /home/onp/code/src/go.universe.tf/metallb" ]
  - [ su, onp, -c, "pip3 install invoke semver" ]
  - [ su, onp, -c, "gpg --keyserver hkp://keyserver.ubuntu.com --recv-keys 14D8B9397A8F10DA44B00FE3B5CCF2B7D917627C" ]

output:
  all: ">> /var/log/cloud-init.log"
users:
  - name: onp
    plain_text_passwd: 'Onp@123'
    lock-passwd: False
    sudo: ALL=(ALL) NOPASSWD:ALL
    groups: sudo
    shell: /bin/bash
ssh_pwauth: True
